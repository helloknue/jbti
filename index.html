<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JBTI — 정의 신념 유형 검사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style id="pagestyle">@page{size:A4;margin:10mm}</style>
<style>
:root{
  --paper:#EEF1F4; --sheet:#FFFFFF; --sheet2:#F6F8FA; --ink:#17232F; --muted:#5C6976; --rule:#D3DAE0; --track:#DCE2E8;
  --c1:#E04F3A; --c2:#159A8B; --c3:#D99520; --c4:#3D5BC4;
  --shadow:0 1px 2px rgba(23,35,47,.06),0 8px 24px rgba(23,35,47,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10171D; --sheet:#19232B; --sheet2:#1F2A33; --ink:#E7EDF2; --muted:#9AA8B4; --rule:#2F3D48; --track:#2B3843;
    --c1:#FF7360; --c2:#3CC9B8; --c3:#F2B54B; --c4:#7B93F0; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#10171D; --sheet:#19232B; --sheet2:#1F2A33; --ink:#E7EDF2; --muted:#9AA8B4; --rule:#2F3D48; --track:#2B3843;
  --c1:#FF7360; --c2:#3CC9B8; --c3:#F2B54B; --c4:#7B93F0; --shadow:none;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
.disp{font-family:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400}
.wrap{max-width:680px;margin:0 auto;padding:16px 18px 64px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c4);outline-offset:3px;border-radius:6px}
h1,h2,h3{margin:0}
p{margin:0 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);
  padding:12px 22px;border-radius:999px;font-weight:700;cursor:pointer;min-height:50px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{min-height:40px;padding:8px 16px;font-size:14px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .small{font-size:14px}
.linkbtn{background:none;border:0;padding:8px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--muted);font-size:14px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px}
.logo{font-size:23px;letter-spacing:.5px}
/* hero */
.hero{position:relative;background:var(--sheet);border-radius:22px;padding:22px 20px 24px;box-shadow:var(--shadow);overflow:hidden}
.hero svg{width:100%;height:auto;display:block}
.hero h1{font-size:clamp(30px,8vw,48px);line-height:1.15;margin:14px 0 10px}
.lane-anim circle{animation:run 3.2s ease-in-out infinite alternate}
.lane-anim circle:nth-of-type(2){animation-delay:.3s}.lane-anim circle:nth-of-type(3){animation-delay:.6s}.lane-anim circle:nth-of-type(4){animation-delay:.9s}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(150px)}}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.fact{background:var(--sheet2);border-radius:12px;padding:10px;text-align:center}
.fact b{display:block;font-size:22px;font-family:"Black Han Sans",sans-serif;font-weight:400}
.fact span{font-size:12px;color:var(--muted)}
.axislist{margin:18px 0 20px;padding:0;list-style:none}
.axislist li{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 14px;margin-bottom:8px;background:var(--sheet);border-radius:14px}
.lane{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;color:#fff;font-size:15px}
.teacher{margin-top:30px;padding-top:12px;border-top:2px solid var(--ink)}
.teacher h2{font-size:15px;margin-bottom:4px}
/* test */
.sticky{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0 10px;margin:0 -2px}
.progress{position:relative;height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.progress .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--c1),var(--c3),var(--c2),var(--c4));border-radius:5px;transition:width .35s}
.pagelabel{font-size:13px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
.q{background:var(--sheet);border-radius:16px;padding:16px 16px 14px;margin-bottom:12px;box-shadow:var(--shadow);transition:opacity .2s}
.q.done{opacity:.72}
.q .num{font-size:12px;color:var(--muted)}
.q .txt{font-size:17px;font-weight:500;margin:2px 0 14px;line-height:1.55}
.q.att{outline:2px dashed var(--rule)}
.scale{display:flex;align-items:center;justify-content:space-between;position:relative;padding:0 2px}
.scale::before{content:"";position:absolute;left:18px;right:18px;top:50%;height:3px;background:var(--track);transform:translateY(-50%)}
.scale button{position:relative;border-radius:50%;border:3px solid var(--ink);background:var(--sheet);cursor:pointer;padding:0;transition:background .12s,transform .12s}
.scale button[data-v="1"],.scale button[data-v="7"]{width:42px;height:42px}
.scale button[data-v="2"],.scale button[data-v="6"]{width:34px;height:34px}
.scale button[data-v="3"],.scale button[data-v="5"]{width:28px;height:28px}
.scale button[data-v="4"]{width:22px;height:22px;border-color:var(--muted)}
.scale button[data-v="1"],.scale button[data-v="2"],.scale button[data-v="3"]{border-color:var(--muted)}
.scale button[aria-checked="true"]{background:var(--ink);transform:scale(1.1)}
.scale button[data-v="1"][aria-checked="true"],.scale button[data-v="2"][aria-checked="true"],.scale button[data-v="3"][aria-checked="true"],.scale button[data-v="4"][aria-checked="true"]{background:var(--muted)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.hint{font-size:14px;color:var(--c1);min-height:22px;margin-top:10px;text-align:right}
/* result */
.rhero{background:var(--sheet);border-radius:22px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.rhero .lanes{position:absolute;left:0;right:0;top:0;height:6px;display:flex}.rhero .lanes i{flex:1}
.code{font-size:clamp(78px,24vw,128px);line-height:1;display:flex;gap:2px;margin:8px 0 2px}
.code span{display:inline-block;animation:drop .55s cubic-bezier(.2,.9,.3,1.3) both}
.code span:nth-child(2){animation-delay:.12s}.code span:nth-child(3){animation-delay:.24s}.code span:nth-child(4){animation-delay:.36s}
@keyframes drop{from{opacity:0;transform:translateY(-30px) rotate(-8deg)}to{opacity:1;transform:none}}
.nick{font-size:clamp(28px,7vw,38px);line-height:1.2;margin:6px 0 6px}
.tag{font-size:18px;margin:0}
.emoji{font-size:52px;line-height:1}
.chipsnav{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chipsnav a,.chipsnav button{flex:none;font-size:13px;text-decoration:none;color:var(--ink);background:var(--sheet);border:1.5px solid var(--rule);border-radius:999px;padding:5px 12px;font-family:inherit;cursor:pointer}
.gate input{width:100%;font-size:20px;letter-spacing:.3em;text-align:center;padding:12px;border:2px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);box-sizing:border-box}
.thub{display:grid;gap:10px}
.thub button{text-align:left;width:100%}
.quality{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.qbadge{font-size:13px;border-radius:999px;padding:4px 10px;background:var(--sheet2)}
.qbadge.ok{color:var(--c2)}.qbadge.bad{color:var(--c1)}
.panel{background:var(--sheet);border-radius:18px;padding:18px;margin:16px 0;box-shadow:var(--shadow)}
.panel h3{font-size:19px;margin-bottom:10px}
.ax{margin:4px 0 18px}.ax:last-child{margin-bottom:2px}
.ax .top{display:flex;justify-content:space-between;font-size:14px;font-weight:500}
.ax .top .on{color:var(--ac);font-weight:700}
.trk{position:relative;height:22px;margin:4px 0 2px}
.trk .l{position:absolute;left:0;right:0;top:8px;height:6px;background:var(--track);border-radius:3px}
.trk .f{position:absolute;top:8px;height:6px;background:var(--ac);border-radius:3px;transition:all .8s cubic-bezier(.2,.8,.2,1)}
.trk .ctr{position:absolute;left:50%;top:3px;width:2px;height:16px;background:var(--muted);transform:translateX(-1px)}
.trk .m{position:absolute;top:1px;width:20px;height:20px;border-radius:50%;background:var(--sheet);border:5px solid var(--ac);transform:translateX(-10px);transition:left .8s cubic-bezier(.2,.8,.2,1)}
.ax .axcap{font-size:13px;color:var(--muted)}
.facet{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:4px}
.facet .mini{position:relative;height:5px;background:var(--track);border-radius:3px}
.facet .mini i{position:absolute;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--ac);transform:translateX(-5px)}
.facet .mini::after{content:"";position:absolute;left:50%;top:-3px;width:1px;height:11px;background:var(--muted)}
.plain{list-style:none;padding:0;margin:0}
.plain li{padding:9px 0;border-bottom:1px dashed var(--rule)}
.plain li:last-child{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sheet2);border-radius:999px;padding:5px 12px;font-size:15px}
.callout{border-left:6px solid var(--c3)}
.sub{font-size:15px;margin:16px 0 6px;color:var(--muted)}
.msgcard{background:linear-gradient(135deg,var(--sheet),var(--sheet2));border-top:6px solid var(--c4)}
.warn{border-left:6px solid var(--c1)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two button,.tcell{text-align:left;background:var(--sheet2);border:2px solid transparent;border-radius:14px;padding:12px;cursor:pointer}
.two button:hover,.tcell:hover{border-color:var(--ink)}
.k{font-size:12.5px;color:var(--muted)}
.c{font-size:24px;display:block;margin:2px 0}
.grid16{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.grid16{grid-template-columns:repeat(4,1fr)}}
.tcell{background:var(--sheet);box-shadow:var(--shadow)}
.tcell.mine{border-color:var(--ink)}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.filt button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}
.filt button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.map svg{width:100%;height:auto;display:block}
.thinker{display:flex;gap:12px;align-items:flex-start;background:var(--sheet2);border-radius:14px;padding:12px;margin-top:10px}
.thinker .dot{flex:none;width:14px;height:14px;border-radius:50%;background:var(--ink);margin-top:6px}
.bal{background:var(--sheet2);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.bal .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bal .opts button{border:2px solid var(--rule);background:var(--sheet);border-radius:10px;padding:10px;cursor:pointer;text-align:left}
.bal .opts button[aria-pressed="true"]{border-color:var(--ink)}
.bal .res{font-size:14px;margin-top:8px;min-height:20px}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--sheet2);padding:8px 10px;border-radius:8px;word-break:break-all}
input[type=text],input[type=number],textarea{border:1.5px solid var(--rule);background:var(--sheet);border-radius:10px;padding:9px 12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px}
.overlay img{max-width:100%;max-height:75vh;border-radius:12px}
/* print: keycap */
.capsheet{display:flex;flex-wrap:wrap;gap:4mm 6mm;background:#fff;padding:2mm}
.capset{break-inside:avoid;page-break-inside:avoid}
.caprow{display:flex;gap:2mm}
.cap{color:#fff;border-radius:1.6mm;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-family:"Black Han Sans","Malgun Gothic",sans-serif}
.cap b{font-weight:400}.cap i{font-style:normal;font-family:"IBM Plex Sans KR","Malgun Gothic",sans-serif;margin-top:.6mm}
.blankcap{background:#fff;border:.3mm dashed #9aa6b1}
.caplab{font-size:2.4mm;color:#5E6B78;margin-top:1mm}
/* print: kit */
.kitcards{display:grid;grid-template-columns:repeat(3,63mm);gap:3mm;justify-content:center}
.kc{width:63mm;height:88mm;background:#fff;color:#1C2B39;border:.3mm solid #9aa6b1;border-radius:3mm;padding:5mm;position:relative;break-inside:avoid;page-break-inside:avoid;font-size:3.4mm;line-height:1.45}
.kc .t{font-size:2.8mm;color:#5E6B78}
.kc .h{font-family:"Black Han Sans","Malgun Gothic",sans-serif;font-size:6.5mm;line-height:1.15;margin:2mm 0 3mm}
.kc .b{font-size:3.4mm}
.kc .ft{position:absolute;left:5mm;right:5mm;bottom:4mm;font-size:2.6mm;color:#5E6B78;border-top:.3mm solid #CDD4DB;padding-top:1.5mm}
.kc .band{position:absolute;left:0;top:0;right:0;height:3mm}
.paper{background:#fff;color:#1C2B39;padding:10mm;width:190mm;font-size:2.9mm;line-height:1.4}
.paper h2{font-family:"Black Han Sans","Malgun Gothic",sans-serif;font-weight:400;font-size:7mm}
.paper table{width:100%;border-collapse:collapse;margin-top:2.5mm}
.paper td,.paper th{border:.25mm solid #9aa5a0;padding:.45mm 2mm;text-align:left}
.paper th{background:#eef1f4}
.paper td.box{width:12mm}
.sheet-preview{overflow-x:auto;padding-bottom:10px}
.boardwrap{overflow-x:auto}
.board{width:400mm;background:#fff}
.pagebreak{break-before:page;page-break-before:always}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  .wrap{max-width:none;padding:0;margin:0}
  :root{padding:0}
  .paper{padding:0;width:auto}
  .cap,.kc,.board{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fadein{animation:fi .45s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>

 {k:"EB",a:"E",b:"B",aw:"Effort",bw:"Background",an:"노력",bn:"배경",ad:"성공은 주로 개인의 노력에서 나온다",bd:"성공에는 집안 배경과 사회 환경이 크게 작용한다",t:"성공의 원인",v:"--c1",pc:"#E04F3A",f:["성공 귀인","기회 구조"]},

 ],
 IS:[
  [0,"a","생활이 어려워지면 정부보다 먼저 자기 자신과 가족이 해결해야 한다."],

 ESNT:{core:"마을 곳간지기는 성실하게 쌓고, 그 곳간을 마을 모두를 위해 지키는 사람이에요. 열심히 일하는 것을 중요하게 여기지만, 쌓은 것은 공동체 모두가 위기 때 기댈 수 있어야 한다고 믿어요. 굶는 이웃이 없는 마을이 좋은 마을이라고 생각하고, 눈에 띄지 않게 공동체의 살림을 챙겨요.",

    return {s,pctA:Math.round((s+36)/72*100),letter:s>=0?ax.a:ax.b,clar:abs<=5?"경계":abs<=17?"보통":"뚜렷",
      facets:fs.map(x=>Math.round((x+18)/36*100))};
  });
  /* 일관성: 같은 하위 지표 안에서 정방향 3문항과 역방향 3문항 평균의 차이 */
  let incons=0;
  AX.forEach((ax,ai)=>[0,1].forEach(f=>{
    const A=[],B=[]; Q.forEach((q,qi)=>{ if(q.att||q.ax!==ai||q.f!==f) return; (q.p==="a"?A:B).push(ans[qi]); });
    const ma=A.reduce((x,y)=>x+y,0)/A.length, mb=8-B.reduce((x,y)=>x+y,0)/B.length;
    if(Math.abs(ma-mb)>=3) incons++;
  }));
  const scored=ans.filter((_,i)=>!Q[i].att), counts={}; scored.forEach(v=>counts[v]=(counts[v]||0)+1);
  const flat=Math.max(...Object.values(counts))/scored.length>=0.75;
  const attOk=Q.every((q,qi)=>!q.att||ans[qi]===q.want);
  return {axes,code:axes.map(x=>x.letter).join(""),incons,flat,attOk,raw:ans.join(""),at:Date.now()};
}
const lensPct=axes=>Math.round(axes.reduce((a,x)=>a+x.pctA,0)/4);
function mapPoint(axes){
  const x=1-(axes[0].pctA+axes[1].pctA)/100, y=1-(axes[2].pctA+axes[3].pctA)/100; return {x,y};
}
function approxAxes(code){ return AX.map((ax,i)=>{const p=code[i]===ax.a?72:28;return {pctA:p,letter:code[i],clar:"보통",facets:[p,p],s:0};}); }

async function saveImage(){
  const r=S.get("jbti-result"); if(!r) return;
  try{ await document.fonts.ready; }catch(e){}
  const t=T[r.code], W=1080, H=1350, cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const g=cv.getContext("2d");
  g.fillStyle="#EEF1F4"; g.fillRect(0,0,W,H);
  g.fillStyle="#fff"; roundRect(g,60,60,W-120,H-120,48); g.fill();
  AX.forEach((a,i)=>{g.fillStyle=a.pc; g.fillRect(60+i*(W-120)/4,60,(W-120)/4,18);});
  g.fillStyle="#5C6976"; g.font="500 34px 'IBM Plex Sans KR', sans-serif"; g.fillText("나의 JBTI 정의 신념 유형",120,170);
  g.font="240px 'Black Han Sans', sans-serif"; let x=112;
  [...r.code].forEach((c,i)=>{g.fillStyle=AX[i].pc; g.fillText(c,x,420); x+=g.measureText(c).width+6;});
  g.font="96px serif"; g.fillText(t[1],W-220,190);
  g.fillStyle="#17232F"; g.font="78px 'Black Han Sans', sans-serif"; g.fillText(t[0],120,540);
  g.fillStyle="#5C6976"; g.font="500 38px 'IBM Plex Sans KR', sans-serif"; g.fillText(t[2],120,605);
  r.axes.forEach((x,i)=>{const y=700+i*126, ax=AX[i], L=120, R=W-120, pos=L+(R-L)*(100-x.pctA)/100, onA=x.letter===ax.a, pct=onA?x.pctA:100-x.pctA;
    g.fillStyle="#17232F"; g.font="700 32px 'IBM Plex Sans KR', sans-serif"; g.fillText(`${ax.a} ${ax.an}`,L,y);
    g.textAlign="right"; g.fillText(`${ax.bn} ${ax.b}`,R,y); g.textAlign="left";
    g.fillStyle="#DCE2E8"; roundRect(g,L,y+22,R-L,14,7); g.fill();
    g.fillStyle=ax.pc; const mid=(L+R)/2; roundRect(g,Math.min(pos,mid),y+22,Math.abs(mid-pos),14,7); g.fill();
    g.beginPath(); g.arc(pos,y+29,20,0,Math.PI*2); g.fillStyle="#fff"; g.fill(); g.lineWidth=10; g.strokeStyle=ax.pc; g.stroke();
    g.fillStyle="#5C6976"; g.font="500 26px 'IBM Plex Sans KR', sans-serif"; g.fillText(`${ax.t} · ${x.letter} ${pct}%`,L,y+76);});
  g.fillStyle="#17232F"; g.font="700 30px 'IBM Plex Sans KR', sans-serif"; g.fillText(`기능론–갈등론 렌즈: 기능론 쪽 ${lensPct(r.axes)}%`,120,1232);
  g.fillStyle="#9AA8B4"; g.font="500 24px 'IBM Plex Sans KR', sans-serif"; g.fillText("JBTI · 나의 정의 신념 유형",120,1270);
  const url=cv.toDataURL("image/png");
  const a=document.createElement("a"); a.href=url; a.download=`JBTI_${r.code}.png`; document.body.appendChild(a); a.click(); a.remove();
  const ov=document.createElement("div"); ov.className="overlay"; ov.innerHTML=`<img src="${url}" alt="JBTI 결과 이미지"><p style="color:#fff;margin:0;text-align:center" class="small">저장이 안 되면 이미지를 길게 눌러 저장하세요.</p><button class="btn ghost" style="color:#fff;border-color:#fff">닫기</button>`;
  ov.addEventListener("click",e=>{if(e.target.tagName!=="IMG") ov.remove();}); document.body.appendChild(ov);
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* ============ 선생님: 설계 근거 ============ */
function about(){
  app.innerHTML=bar()+`<h2 class="disp" style="font-size:28px;margin-bottom:10px">검사 설계 근거</h2>
  <div class="panel"><p style="margin:0">JBTI는 수업용으로 만든 태도 척도예요. 표준화 검사로 검증받은 도구는 아니며, 아래 원칙으로 문항과 채점을 설계했어요.</p></div>
  <div class="panel"><h3>구성 개념과 참고한 이론</h3><ul class="plain">
   <li><b>성공의 원인(E/B)</b> — E = Effort(노력), B = Background(배경). 세부 지표: 성공 귀인 · 기회 구조. 빈곤·성공의 개인적 귀인과 구조적 귀인(Feagin, 1972), 공정한 세상 믿음(Lerner; Lipkus, 1991)</li>
   <li><b>어려움의 책임(I/S)</b> — I = Individual(개인), S = Society(사회). 세부 지표: 생활 안전망 · 기회 보장. 국제사회조사(ISSP) ‘정부의 역할’ 모듈의 정부 책임 문항 구성</li>
   <li><b>공정한 분배(R/N)</b> — R = Reward(보상), N = Need(필요). 세부 지표: 보상 격차 · 생활 속 분배. 분배 정의의 형평·평등·필요 원칙(Deutsch, 1975), ISSP ‘사회 불평등’ 모듈</li>
   <li><b>함께 사는 방식(C/T)</b> — C = Competition(경쟁), T = Teamwork(협동). 세부 지표: 경쟁관 · 관계 태도. 수직적 개인주의와 수평적 집단주의(Triandis &amp; Gelfand, 1998)</li></ul>
   <p class="small muted" style="margin:8px 0 0">원 문항을 그대로 옮기지 않고, 고등학생의 생활 장면에 맞게 새로 쓰거나 바꿔 썼어요.</p></div>
  <div class="panel"><h3>문항 구성과 채점</h3><ul class="plain">
   <li>4개 축 × 12문항 = 48문항 + 응답 확인 문항 2개(18번, 37번) = 50문항</li>
   <li>축마다 하위 지표 2개, 하위 지표마다 앞 글자 방향 3문항 + 뒷 글자 방향 3문항(같은 쪽으로만 답하는 습관 상쇄)</li>
   <li>7점 척도를 −3~+3으로 바꿔 앞 글자 문항은 더하고 뒷 글자 문항은 빼요. 축 점수는 −36~+36, 하위 지표 점수는 −18~+18이에요.</li>
   <li>0 이상이면 앞 글자예요. 비율 = (점수 + 36) ÷ 72 × 100. |점수| 5 이하는 ‘경계’, 6~17은 ‘보통’, 18 이상은 ‘뚜렷’이에요.</li>
   <li><b>응답 일관성</b>: 같은 하위 지표의 정방향 3문항 평균과 역방향 3문항(역채점) 평균이 3점 이상 차이 나면 ‘불일치’로 세요. 8개 중 0개면 높음, 1~2개면 보통, 3개 이상이면 낮음이에요.</li>
   <li>확인 문항을 틀리거나 75% 이상 같은 답을 고르면 다시 하도록 안내해요.</li>
   <li><b>사상가 지도</b>: 가로 = 1·2번 축, 세로 = 3·4번 축의 뒷 글자 쪽 비율 평균. 사상가 위치는 수업용 대략적 배치예요.</li></ul></div>
  <div class="panel"><h3>신뢰도·타당도를 확인하려면</h3><ul class="plain">
   <li><b>내적 일관성</b>: 결과 화면의 응답 기록 코드를 모아 축별(12문항)·하위 지표별(6문항) 크론바흐 알파를 계산해요. 확인 문항(18·37번)은 빼고, 뒷 글자 문항은 8에서 빼서 역채점해요.</li>
   <li><b>검사–재검사</b>: 1~2주 뒤 다시 검사해 축 점수의 상관을 봐요.</li>
   <li><b>내용 타당도</b>: 사회과 교사 2~3명에게 문항이 해당 개념을 재는지 검토받아요.</li>
   <li><b>한계</b>: 표본이 작고 검증 전이므로 결과는 토론의 출발점으로만 쓰고, 학생을 평가하거나 분류하는 데 쓰지 않아요.</li></ul></div>`;
  window.scrollTo(0,0);
}

    const r=Math.floor((n-1)/cols); let c=(n-1)%cols; if(r%2===1)c=cols-1-c;
    const x=ox+c*(cw+gp), y=oy+r*(chh+gp), d=CELLS[n], fill=CELLCOL[d[2]], dark=d[2]==="g";
    cells+=`<g><rect x="${x}" y="${y}" width="${cw}" height="${chh}" rx="3" fill="${fill}" stroke="#1C2B39" stroke-width=".4"/>
    <text x="${x+3}" y="${y+7}" font-size="5.5" font-weight="700" fill="${dark?"#fff":"#1C2B39"}">${n}</text>
    <text x="${x+cw/2}" y="${y+17}" font-size="6.3" text-anchor="middle" font-family="Black Han Sans, sans-serif" fill="${dark?"#fff":"#1C2B39"}">${d[0]}</text>
    ${wrapSVG(d[1],x+cw/2,y+24,cw-4,3.6,dark?"#fff":"#1C2B39")}</g>`;
  }
  const lx=ox+cols*(cw+gp)+8;
  const rules=["1. 3명이 출발선(가1·나1·다1)·능력 카드를 받는다", "2. 차례대로 굴려 이동(은행·진행자 교사가 진행)", "💰 부: 게임 돈 · ⭐ 위신: 존경", "🔨 권력: 1개 내면 주사위 ±1·카드 재뽑기", "📘 실력: 배움·자습으로. 점수엔 없음", "3. 권력 자리는 지나가도 도전 가능", "   회장 누구나 · 주민자치회장 위신·권력1↑", "   시의원 권력2↑, 주사위 5↑", "4. 진로 관문: 실력+주사위 5↑ → 진학", "   등록금 4 (실력 3↑이면 면제)", "5. 취업 관문: 열쇠가 맞는 직업 고르기", "   의사 진학+실력3 · 공무원 실력3", "   회사원 실력2+(진학 또는 위신1)", "   자영업 부 4 · 예술가 누구나", "   월급날 표시(💰) 칸은 지나가도 월급", "6. 결산: 부 + 위신×2 + 권력×2", "   세 자원 모두 높으면 지위 일관 +4", "7. 자녀 출발선 27↑가 · 18~26나 · 17↓다", "8. 물려주기: 부의 절반 · 권력3↑ → 권력+1", "9. 2세대는 20칸까지, 가문 점수 최고 승리"];
  const legend=`<g font-size="3.6" fill="#1C2B39"><text x="${lx}" y="${oy+6}" font-family="Black Han Sans, sans-serif" font-size="8">게임 규칙</text>
   ${rules.map((r,i)=>`<text x="${lx}" y="${oy+16+i*6.2}" xml:space="preserve">${esc(r)}</text>`).join("")}
   ${Object.entries({l:"배움(→실력)",k:"자습(→실력)",e:"사건",m:"용돈·알바(→부)",g:"관문·심사",v:"선거(→권력)",p:"💰지나가면 월급",s:"기타"}).map(([k,v],i)=>`<rect x="${lx+(i%2)*44}" y="${oy+16+rules.length*6.2+4+Math.floor(i/2)*8}" width="5" height="5" fill="${CELLCOL[k]}" stroke="#1C2B39" stroke-width=".3"/><text x="${lx+(i%2)*44+7}" y="${oy+16+rules.length*6.2+8.2+Math.floor(i/2)*8}">${v}</text>`).join("")}</g>`;
  app.innerHTML=bar()+`<div class="noprint"><h2 class="disp" style="font-size:28px">게임 보드 인쇄 (A3 가로)</h2>
  <p class="small">인쇄 창에서 용지를 A3 가로로 맞추세요. A3가 없으면 A4 2장에 나눠 인쇄해 이어 붙여도 돼요.</p>
  <div class="row" style="margin:8px 0 14px"><button class="btn" data-act="print">인쇄하기</button></div></div>
  <div class="boardwrap"><svg class="board" viewBox="0 0 ${W} 277" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif">
   <text x="8" y="18" font-family="Black Han Sans, sans-serif" font-size="12" fill="#1C2B39">대물림 인생게임 — 인생 보드</text>
   ${cells}${legend}

  </svg></div>`;
}
function wrapSVG(text,cx,y,maxW,fs,fill){
  const per=Math.floor(maxW/(fs*0.95)); const words=text.split(" "); const lines=[]; let cur="";
  words.forEach(w=>{ if((cur+" "+w).trim().length>per){ if(cur)lines.push(cur); cur=w; } else cur=(cur+" "+w).trim(); }); if(cur)lines.push(cur);
  return lines.slice(0,5).map((l,i)=>`<text x="${cx}" y="${y+i*(fs+1.2)}" font-size="${fs}" text-anchor="middle" fill="${fill}">${esc(l)}</text>`).join("");
}



/* ============ 선생님: 종이 검사지 ============ */
function sheet(){
  setPage("A4");
  const groups=AX.map((ax,ai)=>{const A=[],B=[];Q.forEach((q,qi)=>{if(!q.att&&q.ax===ai)(q.p==="a"?A:B).push(qi+1);});return {ax,A,B};});
  app.innerHTML=bar()+`<div class="noprint"><h2 class="disp" style="font-size:28px">종이 검사지</h2>
  <p class="small">기기를 쓸 수 없을 때 써요. 앞장은 문항, 뒷장은 채점표예요. 하위 지표와 일관성 지수는 웹 검사에서만 계산돼요.</p><div class="row" style="margin:8px 0 14px"><button class="btn" data-act="print">인쇄하기</button></div></div>
  <div class="sheet-preview"><div class="paper"><h2>JBTI 정의 신념 유형 검사</h2>
  <p style="margin:1mm 0">이름 ____________ &nbsp; 각 문장이 내 생각과 얼마나 같은지 1~7 숫자로 쓰세요. 1 전혀 아니다 · 2 아니다 · 3 약간 아니다 · 4 보통 · 5 약간 그렇다 · 6 그렇다 · 7 매우 그렇다</p>
  <table><tbody>${Q.map((q,qi)=>`<tr><td style="width:7mm">${qi+1}</td><td>${esc(q.att?`이 문항은 응답 확인용이에요. ${q.want}를 쓰세요.`:q.t)}</td><td class="box"></td></tr>`).join("")}</tbody></table>
  <div class="pagebreak"></div><h2 style="margin-top:3mm">채점표</h2>
  <p>① 축마다 앞 글자 문항 숫자의 합(가)과 뒷 글자 문항 숫자의 합(나)을 구해요. ② 가 − 나 가 0 이상이면 앞 글자, 0보다 작으면 뒷 글자예요. ③ 앞 글자 비율(%) = (가 − 나 + 36) ÷ 72 × 100</p>
  <table><thead><tr><th>축</th><th>앞 글자 문항</th><th>합(가)</th><th>뒷 글자 문항</th><th>합(나)</th><th>가−나</th><th>글자</th></tr></thead>
  <tbody>${groups.map(g=>`<tr><td>${g.ax.t}</td><td>${g.ax.a} ${g.ax.an}: ${g.A.join(", ")}</td><td class="box"></td><td>${g.ax.b} ${g.ax.bn}: ${g.B.join(", ")}</td><td class="box"></td><td class="box"></td><td class="box"></td></tr>`).join("")}</tbody></table>
  <p style="margin-top:4mm">나의 유형 ☐☐☐☐ · 별칭 ____________</p>
  <table><thead><tr><th>유형</th><th>별칭</th><th>유형</th><th>별칭</th></tr></thead><tbody>${Array.from({length:8},(_,i)=>`<tr><td>${KEYS[i]}</td><td>${T[KEYS[i]][0]}</td><td>${KEYS[i+8]}</td><td>${T[KEYS[i+8]][0]}</td></tr>`).join("")}</tbody></table></div></div>`;
}
function setPage(sz){document.getElementById("pagestyle").textContent=`@page{size:${sz};margin:${sz.startsWith("A3")?"8mm":"10mm"}}`;}

/* ============ 선생님용 페이지(비밀번호) ============ */
const TEACH=["keycap","kit","board","sheet","about"];
let UNLOCK=false, TNEXT="";
try{UNLOCK=sessionStorage.getItem("jbti-teacher")==="ok";}catch(e){}
const PWK={s:"72da588079562dc85d069ce53aef6d91",h:"2bcc1b10dce4072d0fe49501508beea6b759d6c136e3349e058d001b28dc2816",n:150000};
const hexBuf=x=>new Uint8Array(x.match(/../g).map(v=>parseInt(v,16)));
const bufHex=b=>Array.from(new Uint8Array(b)).map(v=>v.toString(16).padStart(2,"0")).join("");
async function pwCheck(pw){
  if(!(window.crypto&&crypto.subtle)) throw new Error("nocrypto");
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:hexBuf(PWK.s),iterations:PWK.n},key,256);
  return bufHex(bits)===PWK.h;
}
async function unlock(){
  const inp=document.getElementById("tpw"), msg=document.getElementById("tmsg"); if(!inp) return;
  msg.textContent="확인하는 중…";
  let ok=false;
  try{ ok=await pwCheck(inp.value.trim()); }catch(e){ msg.textContent="이 브라우저에서는 확인할 수 없어요. 최신 브라우저로 열어 주세요."; return; }
  if(!ok){ msg.textContent="비밀번호가 맞지 않아요."; inp.value=""; inp.focus(); return; }
  UNLOCK=true; try{sessionStorage.setItem("jbti-teacher","ok");}catch(e){}
  const n=TNEXT; TNEXT=""; go(n||"teacher");
}
function teacher(){
  setPage("A4");
  if(!UNLOCK){
    app.innerHTML=bar()+`<div class="panel gate" style="max-width:420px;margin:40px auto;text-align:center">
     <h2 class="disp" style="font-size:26px;margin:0 0 6px">🔒 선생님용 페이지</h2>
     <p class="small muted" style="margin:0 0 14px">수업을 진행하는 선생님만 들어갈 수 있어요. 비밀번호를 입력하세요.</p>
     <input id="tpw" type="password" inputmode="numeric" autocomplete="off" aria-label="비밀번호">
     <div style="margin-top:12px"><button class="btn" data-act="unlock">들어가기</button></div>
     <p id="tmsg" class="small" role="status" aria-live="polite" style="margin:10px 0 0;color:var(--c1);min-height:1.4em"></p>
     <div style="margin-top:6px"><button class="linkbtn" data-go="home">처음으로</button></div></div>`;
    setTimeout(()=>{const i=document.getElementById("tpw"); if(i) i.focus();},50);
    return;
  }
  const items=[["keycap","키캡 스티커 인쇄","학생 유형 코드를 넣어 키캡용 네 글자 스티커를 스티커 용지에 인쇄해요."],["kit","게임 카드 인쇄","출발선·직업·사건·능력·규칙 요약 카드를 A4로 인쇄해요."],["board","게임 보드 인쇄(A3)","대물림 인생게임 30칸 보드를 A3 가로로 인쇄해요."],["sheet","종이 검사지","기기가 없을 때 쓰는 종이 검사지와 채점표예요."],["about","검사 설계 근거","네 축의 구성 개념, 참고 이론, 채점 방식과 신뢰도 점검 방법이에요."]];
  app.innerHTML=bar()+`<h2 class="disp" style="font-size:28px;margin-bottom:10px">선생님용 페이지</h2>
   <div class="thub">${items.map(([k,n,dsc])=>`<button class="panel" data-go="${k}" style="margin:0;cursor:pointer;border:1.5px solid var(--rule)"><b style="font-size:17px">${n}</b><br><span class="small muted">${dsc}</span></button>`).join("")}</div>
   <div class="row" style="margin-top:16px;justify-content:center"><button class="linkbtn" data-act="lock">잠그고 나가기</button></div>`;
}
/* ============ 라우팅 ============ */
function parseRoute(){
  const h=location.hash.slice(1), qs=new URLSearchParams(location.search);
  const m=h.match(/^t[=/]([A-Za-z]{4})/); if(m&&T[m[1].toUpperCase()]) return ["type",m[1].toUpperCase()];
  const qt=(qs.get("t")||"").toUpperCase(); if(!h&&T[qt]) return ["type",qt];
  const [v,arg]=(h||"home").split("/"); return [v,arg];
}
function go(view,arg){ const h=view==="type"?`t=${arg}`:view; if(location.hash.slice(1)===h) render(); else location.hash=h; }
function render(){
  document.querySelectorAll(".overlay").forEach(o=>o.remove());
  const [v,arg]=parseRoute();
  if(v!=="board"&&v!=="kit"&&v!=="keycap"&&v!=="sheet") setPage("A4");
  if(TEACH.includes(v)&&!UNLOCK){TNEXT=v; teacher(); return;}
  ({test,result,types,about,keycap,kit,board,sheet,teacher}[v]||(v==="type"?()=>typeView(arg):home))();
}
window.addEventListener("hashchange",render);

app.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.jump){const el=document.getElementById(b.dataset.jump); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); return;}
  if(b.dataset.go){go(b.dataset.go);return;}
  if(b.dataset.type){go("type",b.dataset.type);return;}
  if(b.dataset.filt){TF=b.dataset.filt;types();return;}
  if(b.dataset.bal){
    const i=+b.dataset.bal, bq=BAL[i], code=(parseRoute()[0]==="type"?parseRoute()[1]:(S.get("jbti-result")||{}).code)||"", letter=code[bq.ax];
    b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    const typePick=letter===AX[bq.ax].a?"a":"b"; BALPICK[i]=b.dataset.pick===typePick;
    document.getElementById("br"+i).innerHTML=(BALPICK[i]?`✔ 이 유형과 같은 선택이에요.`:`✦ 이 유형이라면 아마 ‘${esc(bq[typePick])}’를 골랐을 거예요.`)+` <span class="muted">(${AX[bq.ax].t}: ${letter} ${letter===AX[bq.ax].a?AX[bq.ax].an:AX[bq.ax].bn})</span>`;
    const n=Object.keys(BALPICK).length, m=Object.values(BALPICK).filter(Boolean).length;
    if(n===BAL.length) document.getElementById("balsum").innerHTML=`<b>싱크로율 ${Math.round(m/n*100)}%</b> — ${BAL.length}개 중 ${m}개가 이 유형의 예상 선택과 같았어요.`;
    return;
  }
  if(b.dataset.q){
    const qi=+b.dataset.q,v=+b.dataset.v; state.answers[qi]=v; S.set("jbti-progress",state);
    b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-checked",x===b));
    b.closest(".q").classList.add("done");
    const answered=state.answers.filter(Boolean).length, fill=document.querySelector(".progress .fill"); if(fill) fill.style.width=answered/Q.length*100+"%";
    const pl=document.querySelector(".pagelabel span:last-child"); if(pl) pl.textContent=`${answered} / ${Q.length} 응답`;
    const h=document.getElementById("hint"); if(h)h.textContent="";
    const nextQ=b.closest(".q").nextElementSibling; if(nextQ&&nextQ.classList.contains("q")&&!nextQ.classList.contains("done")) setTimeout(()=>nextQ.scrollIntoView({behavior:"smooth",block:"center"}),150);
    return;
  }
  const act=b.dataset.act;
  if(act==="prev"){state.page=Math.max(0,state.page-1);S.set("jbti-progress",state);test();}
  if(act==="next"){
    const from=state.page*PER,to=Math.min(from+PER,Q.length),miss=[];
    for(let i=from;i<to;i++) if(!state.answers[i]) miss.push(i+1);
    if(miss.length){document.getElementById("hint").textContent=`${miss.join(", ")}번 문항에 답해 주세요.`;return;}
    if(state.page<PAGES-1){state.page++;S.set("jbti-progress",state);test();}
    else{ const r=score(state.answers); S.set("jbti-result",r); state=blank(); S.del("jbti-progress"); go("result"); }
  }
  if(act==="retake"){state=blank();S.del("jbti-progress");go("test");}
  if(act==="unlock"){unlock();return;}
  if(act==="lock"){UNLOCK=false; try{sessionStorage.removeItem("jbti-teacher");}catch(e){} go("home"); return;}
  if(act==="print") window.print();
  if(act==="saveimg") saveImage();
  if(act==="capsize"){KS=+document.getElementById("ks").value||14;KN=Math.max(1,Math.min(6,+document.getElementById("kn").value||1));KL=document.getElementById("kl").checked;KCODES=document.getElementById("kcodes").value;keycap();}
});
app.addEventListener("keydown",e=>{
  if(e.target.id==="tpw"&&e.key==="Enter"){e.preventDefault(); unlock(); return;}
  const b=e.target.closest(".scale button"); if(!b) return;
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();const n=e.key==="ArrowRight"?b.nextElementSibling:b.previousElementSibling;if(n){n.focus();n.click();}}
});
render();
})();
</script>
